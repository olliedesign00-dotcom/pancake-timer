  --cloth-base:#fffaf8;
  --cloth-line:rgba(233,169,160,.30);
  --d-edge:#5e3624;          /* shared border colour across the new design */
  --d-btn-edge:#b7630e;
  --d-btn-mid:#eeae6d;

  --d-serve-edge:#bc8f18;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1c1917;
    --panel:#252120;
    --edge:#3a3330;
    --ink:#f3ece4;
    --ink-2:#b7aa9d;
    --ink-3:#8a7d72;
    --chip:#332d2a;
    --accent-ink:#ff9d9d;
    --shadow:0 2px 0 rgba(0,0,0,.25), 0 18px 40px -28px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#1c1917;
  --panel:#252120;
  --edge:#3a3330;
  --ink:#f3ece4;
  --ink-2:#b7aa9d;
  --ink-3:#8a7d72;
  --chip:#332d2a;
  --accent-ink:#ff9d9d;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 18px 40px -28px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:Nunito,"Noto Sans TC",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(18px,4vw,40px) 96px}

/* ---------- type ---------- */
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{
  font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0;
}
h1{font-size:clamp(30px,5.5vw,48px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
h2{font-size:clamp(20px,3vw,26px);font-weight:800;letter-spacing:-.005em}
.lede{color:var(--ink-2);max-width:60ch;margin:0}
.note{color:var(--ink-2);font-size:14.5px;max-width:66ch;margin:0}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header.top{display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(28px,5vw,48px)}
section{margin-top:clamp(48px,8vw,88px);display:flex;flex-direction:column;gap:20px}
.sec-head{display:flex;flex-direction:column;gap:6px}

/* ---------- hero ---------- */
.stage{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:22px;
  justify-items:center;
}
.pan-card{
  width:min(100%,430px);
  border:5px solid var(--d-edge);
  border-radius:30px;
  overflow:hidden;
  box-shadow:var(--shadow);
  background:var(--d-frame);
  line-height:0;
}
.readout{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
}
.stage-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px 8px;border-radius:999px;
  font-weight:800;font-size:14px;letter-spacing:.01em;
  background:var(--chip-bg,var(--chip));color:var(--chip-fg,var(--ink-2));
  transition:background .5s linear,color .5s linear;
}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.clock{
  font-family:Chango,Nunito,sans-serif;
  font-size:34px;line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.clock .pre{font-family:Nunito,sans-serif;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-right:8px;vertical-align:middle}

/* ---------- Buttons (Figma: 217x90 + 5px border, three stacked layers) ---------- */
.pad{width:min(100%,430px);display:flex;flex-direction:column;gap:20px}
.pad-row{display:flex;gap:14px;align-items:flex-start}
.pad-row .pbtn{flex:1 1 0;min-width:0}
.pbtn{
  --h:74px;                       /* inner height; 90 in the design */
  --edge:var(--d-btn-edge);
  --mid:var(--d-btn-mid);
  --face:var(--d-btn-face);
  --lbl:18px;
  position:relative;
  display:grid;place-items:center;
  height:calc(var(--h) + 10px);
  margin-top:0;
  padding-bottom:calc(var(--h) * 9 / 90);
  appearance:none;cursor:pointer;
  border:5px solid var(--d-edge);
  border-radius:calc(20px + 5px);
  background:var(--edge);
  transition:height .13s ease, margin-top .13s ease, padding-bottom .13s ease, transform .1s ease;
}
.pbtn::before,.pbtn::after{content:"";position:absolute;left:0;right:0;top:0;border-radius:20px}
.pbtn::before{height:calc(var(--h) * 84 / 90);background:var(--mid)}
.pbtn::after{height:calc(var(--h) * 81 / 90);background:var(--face)}
/* Hover: the button presses into the counter. Height 90 -> 84 (Figma node
   2704:2770 / 2704:2776), but anchored at the BOTTOM so the top edge sinks 6px.
   Shrinking from the bottom would read as the button lifting instead.
   margin-top makes up the height difference so the layout does not jump. */
.pbtn:hover:not([disabled]){
  height:calc(var(--h) * 84 / 90 + 10px);
  margin-top:calc(var(--h) * 6 / 90);
  padding-bottom:calc(var(--h) * 3 / 90);   /* keeps the label centred on the face layer */
}
.pbtn:active{transform:translateY(3px)}
.pbtn:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
.pbtn[disabled]{opacity:.45;cursor:default;filter:none;transform:none}
.pbtn > .grain{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  border-radius:20px;
  background-image:var(--noise);
  background-repeat:repeat;
  background-size:128px 128px;
  mix-blend-mode:overlay;
  opacity:.45;
}
.pbtn-label{
  position:relative;z-index:2;
  font-family:Chango,Nunito,sans-serif;
  font-size:var(--lbl);line-height:1;
  letter-spacing:3px;
  color:var(--d-edge);
  text-shadow:
    0 -4px 0 #fff, 1.53px -3.7px 0 #fff, 2.83px -2.83px 0 #fff, 3.7px -1.53px 0 #fff,
    4px 0 0 #fff, 3.7px 1.53px 0 #fff, 2.83px 2.83px 0 #fff, 1.53px 3.7px 0 #fff,
    0 4px 0 #fff, -1.53px 3.7px 0 #fff, -2.83px 2.83px 0 #fff, -3.7px 1.53px 0 #fff,
    -4px 0 0 #fff, -3.7px -1.53px 0 #fff, -2.83px -2.83px 0 #fff, -1.53px -3.7px 0 #fff;
}
.pbtn--serve{
  --edge:var(--d-serve-edge);
  --mid:var(--d-serve-mid);
  --face:var(--d-serve-face);
  --lbl:32px;
}
.crumbs{
  position:absolute;z-index:1;left:0;top:0;width:100%;
  height:calc(var(--h) * 81 / 90);
  pointer-events:none;
}
.cutlery{
  filter:url(#fx-cutlery);
  position:absolute;z-index:3;top:50%;
  height:calc(var(--h) * 138 / 90);
  width:auto;
  transform:translateY(-50%);
  pointer-events:none;
}
.cutlery--fork{left:calc(47px - 23px);transform:translateY(-50%) rotate(-10deg)}
.cutlery--knife{right:calc(47px - 18px);transform:translateY(-50%) rotate(10deg)}
/* on hover the cutlery tilts slightly, as if being picked up */
.cutlery{transition:transform .28s cubic-bezier(.34,1.32,.64,1)}
.pbtn:hover .cutlery--fork{transform:translateY(-50%) rotate(-19deg)}
.pbtn:hover .cutlery--knife{transform:translateY(-50%) rotate(19deg)}
.pbtn[disabled]:hover .cutlery--fork{transform:translateY(-50%) rotate(-10deg)}
.pbtn[disabled]:hover .cutlery--knife{transform:translateY(-50%) rotate(10deg)}
@media (prefers-reduced-motion:reduce){
  .cutlery{transition:none}
  .pbtn:hover .cutlery--fork{transform:translateY(-50%) rotate(-10deg)}
  .pbtn:hover .cutlery--knife{transform:translateY(-50%) rotate(10deg)}
}

/* ---------- doneness ramp / scrubber ---------- */
.ramp{width:min(100%,560px);display:flex;flex-direction:column;gap:9px}
.ramp-mark{
  position:relative;height:15px;
  font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--accent-ink);
}
.ramp-mark span{position:absolute;left:83.333%;transform:translateX(-50%);white-space:nowrap;bottom:0}
.ramp-track{
  position:relative;height:26px;border-radius:13px;
  background:linear-gradient(90deg,#feefcd 0%,#fedd94 11%,#e9a552 62%,#d57e36 83.3%,#8f5730 91%,#5e3624 100%);
  box-shadow:inset 0 0 0 1px rgba(120,80,40,.16);
  cursor:pointer;
}
.ramp-track:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
.ramp-perfect{
  position:absolute;top:-5px;bottom:-5px;left:83.333%;width:2px;
  background:rgba(60,40,25,.42);border-radius:2px;
}
.playhead{
  position:absolute;top:50%;left:0;
  width:20px;height:34px;border-radius:8px;
  transform:translate(-50%,-50%);
  background:var(--ground);
  box-shadow:0 0 0 3px var(--ink) inset, 0 4px 10px -3px rgba(0,0,0,.45);
  pointer-events:none;
}
.ramp-legend{
  display:flex;justify-content:space-between;
  font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--ink-3);
}
.speed{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12.5px;color:var(--ink-3);
}
.speed-group{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.sp-btn{
  appearance:none;border:0;cursor:pointer;background:transparent;
  font:inherit;font-weight:800;color:var(--ink-3);
  padding:5px 13px;border-radius:999px;
  transition:background .16s ease,color .16s ease;
}
.sp-btn:hover{color:var(--ink-2)}
.sp-btn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.sp-btn[aria-pressed="true"]{background:var(--ground);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.speed em{font-style:normal}
.ramp-legend b{font-weight:800;color:var(--accent-ink)}

/* ---------- state grid ---------- */
.states{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:clamp(14px,2.5vw,24px);
}
.state{display:flex;flex-direction:column;gap:11px}
.state figure{margin:0;border:5px solid var(--d-edge);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:var(--d-frame);line-height:0}
.state h3{font-size:16px;font-weight:800}
.state .meta{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.5}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.sw{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.sw i{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}

/* ---------- board ---------- */
.board{
  border-radius:20px;overflow:hidden;box-shadow:var(--shadow);
  background:var(--d-board);line-height:0;
}

/* ---------- spec table ---------- */
.specs{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--edge);vertical-align:top}
th{font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--chip);padding:1.5px 6px;border-radius:6px;color:var(--ink-2);
}

footer{margin-top:clamp(48px,8vw,80px);padding-top:22px;border-top:1px solid var(--edge);color:var(--ink-3);font-size:13px}

/* ---------- Dial ---------- */
.dial{opacity:0;transition:opacity .22s ease}
.pan-card:hover .dial,
.pan-card.is-setting .dial{opacity:1}
.pan-card.is-served .dial{opacity:0}
.pan-card.is-served .grip{display:none}
.grip{cursor:grab;touch-action:none}
.grip:active{cursor:grabbing}
.grip:focus-visible{fill:rgba(194,91,91,.10);stroke:var(--accent-ink);stroke-width:3;outline:none}
.dial-hint{
  font-size:12.5px;color:var(--ink-3);text-align:center;margin:0;
  transition:color .2s ease;
}
.dial-hint b{color:var(--accent-ink);font-weight:800}

/* ---------- Grain (matched against the grain in the Figma export) ---------- */
.grainy{position:relative;isolation:isolate}
.grainy::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;
  background-image:var(--noise);
  background-repeat:repeat;
  background-size:128px 128px;
  mix-blend-mode:overlay;
  opacity:.6;
}

/* ---------- svg pan internals ---------- */
.cake{
  font-family:Chango,Nunito,sans-serif;
  font-size:70px;
  text-anchor:middle;
  dominant-baseline:central;
  paint-order:stroke;
  stroke-linejoin:round;
}
.cake-outer{stroke-width:11}   /* batter edge; measured at about 5.5px */
/* Shadow: Figma uses a weight-10 OUTSIDE stroke. SVG only has centred
   strokes, but since the pancake covers this layer completely, drawing it
   at 20 puts the full 10px outside. */
.cake-shade-wrap{opacity:.5}
.cake-shade{stroke-width:20;transform:translateY(2px)}
.cake-inner{stroke-width:6}    /* the inner highlight ring */
.padlabel{
  font-family:Chango,Nunito,sans-serif;
  text-anchor:middle;dominant-baseline:central;
  letter-spacing:3px;paint-order:stroke;stroke-linejoin:round;
}
@media (prefers-reduced-motion:reduce){
  .btn{transition:none}
}

/* ========== Web-page layout (overrides the doc-page layout above) ========== */
html,body{height:100%}
body{
  margin:0;
  background:var(--cloth-base);
  background-image:
    repeating-linear-gradient(90deg, var(--cloth-line) 0 62px, transparent 62px 100px),
    repeating-linear-gradient(0deg,  var(--cloth-line) 0 62px, transparent 62px 100px);
  color:var(--ink);
  font-family:Nunito,"Noto Sans TC",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden;
}
body::after{                      /* the cloth takes the same grain */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:var(--noise);background-repeat:repeat;background-size:128px 128px;
  mix-blend-mode:overlay;opacity:.45;
}
#shell{position:relative;z-index:1}
#stage{position:absolute;left:0;top:0;width:660px;height:900px;transform-origin:top left}
#stage > *{position:absolute}

/* ---- Every coordinate straight from the design ---- */
#hero{left:104px;top:101px;width:454px;height:500px;box-shadow:none}
.pad{left:104px;top:641px;width:454px;display:flex;flex-direction:column;gap:20px}
.pad-row{display:flex;gap:4px;align-items:flex-start}
.pad-row .pbtn{flex:1 1 0;min-width:0}
.pbtn{--h:90px;--lbl:20px}
.pbtn--serve{--lbl:40px}

/* ---- Title and decorations ---- */
.title{
  /* 14px of extra viewBox, so the 10px outside stroke is not clipped */
  left:-5px;top:13px;width:360.449px;height:176.365px;
  pointer-events:none;
}
.title text{
  font-family:Chango,Nunito,sans-serif;
  font-size:40px;letter-spacing:3px;
  text-anchor:middle;dominant-baseline:central;
  paint-order:stroke;stroke-linejoin:miter;stroke-miterlimit:4;
}
/* Figma: back layer is a 10-outside #5e3624 stroke, front layer a 5-outside
   #ffffff stroke, both filled #d57e36. Inside out that reads orange / 5px
   white / 5px dark brown, and the counters (the holes in A and P) must be white.

   Simply stacking the two strokes breaks: the dark stroke also reaches 10px
   INTO the counters while the white only reaches 5px, so it cannot cover it
   and the middle of A's counter stays dark brown. Hence four layers — lay
   down white wide enough to fill the counters, mask the dark layer to the
   outside of the glyphs, then put the 5px white edge back on top. */
.t-mask  text{fill:#000;stroke:#000;stroke-width:8}      /* mask: glyph + 4px, which fills the counters */
.t-inner text{fill:#fff;stroke:#fff;stroke-width:20}     /* white base that fills the counters */
.t-edge  text{fill:none;stroke:#5e3624;stroke-width:20}  /* dark brown outline, masked to outside the glyphs */
.t-halo  text{fill:#fff;stroke:#fff;stroke-width:10}     /* 5px white ring */
.t-core  text{fill:#d57e36;stroke:none}                  /* orange glyph body */
.t-solid text{fill:#fff;stroke:#fff;stroke-width:20;stroke-linejoin:round}  /* solid silhouette used as the grain mask */
/* Grain: same opacity and blend mode as the buttons' .grain */
.t-grain,.d-grain{mix-blend-mode:overlay;opacity:.45}
/* Only the handle needs to be interactive inside the pan SVG; everything
   else refuses pointer events. The two serve-cutlery images sit at opacity 0,
   but an SVG <image> still intercepts clicks — and they sit at the bottom
   corners of the card, exactly over the middle of the handle when it is
   turned to a diagonal. */
/* The sunburst behind the plate on a successful serve (Figma node 2706:2857).
   The original is a conic-gradient at mix-blend-lighten 60%; this uses SVG
   wedges instead, so it can sit behind the plate and in front of the pan. */
.rays{
  mix-blend-mode:lighten;
  transform-box:view-box;transform-origin:227px 248.5px;
  animation:rays-spin 20s linear infinite;
}
@keyframes rays-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .rays{animation:none} }
.pan-card svg *{pointer-events:none}
.pan-card svg .grip{pointer-events:auto}
.spark{background:#fff;width:17.08px;height:12px;transform:rotate(-7.93deg);pointer-events:none}
.deco{pointer-events:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap;border:0}

    ADV[ch] = MEASURE.getComputedTextLength();
    return ADV[ch];
  }
  function slotLen(ch, i){
    if (i === 2) return null;                       /* the colon keeps its natural width */
    var n = advance(ch);
    if (!n) return null;
    return Math.max(n * 0.92, Math.min(n * 1.15, TARGET_W));
  }

  /* ---- Bubble seeds: positions measured off the dots in Figma
         (454x500 frame coordinates) ---- */
  var FIG_BUB  = [[124,270,2,2],[118,273,3,4],[335,236,5,5],[342,241,2,2],
                  [179,229,2,2],[183,230,5,4],[242,272,2,2],[246,273,5,4]];
  var FIG_CHAR = [[338,233,8,7],[347,241,5,5],[245,262,8,7],[185,229,13,8],
                  [171,274,3,3],[162,269,7,5],[253,269,5,5],[99,238,11,7]];

  function rnd(i, salt){
    var x = Math.sin(i * 127.1 + salt * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  var BUBBLES = [];
  FIG_BUB.forEach(function(p, i){
    BUBBLES.push({
      x:p[0]+p[2]/2, y:p[1]+p[3]/2, r:Math.max(p[2],p[3])/2 + 1.0,
      born:0.055 + 0.05 * rnd(i,1), charAt:9, ph:rnd(i,2) * 6.283
    });
  });
  FIG_CHAR.forEach(function(p, i){
    BUBBLES.push({
      x:p[0]+p[2]/2, y:p[1]+p[3]/2, r:Math.max(p[2],p[3])/2 * 0.5 + 1.1,
      born:0.09 + 0.28 * rnd(i,3), charAt:0.02 + 0.40 * rnd(i,4), ph:rnd(i,5) * 6.283
    });
  });
  for (var bi = 0; bi < 16; bi++){
    BUBBLES.push({
      x:96 + rnd(bi,6) * 262,
      y:222 + rnd(bi,7) * 57,
      r:1.3 + rnd(bi,8) * 2.2,
      born:0.06 + 0.34 * rnd(bi,9),
      charAt:rnd(bi,10) < 0.4 ? 0.04 + 0.46 * rnd(bi,11) : 9,
      ph:rnd(bi,12) * 6.283
    });
  }

  function el(name, attrs){
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* ---- One pan ---- */
  function makeTiimer(opts){
    opts = opts || {};
    var uid = "g" + Math.random().toString(36).slice(2, 8);
    var svg = el("svg", {viewBox:opts.frame || "0 0 454 500", width:"100%", role:"img"});
    svg.setAttribute("aria-label", opts.label || "Pancake timer");

    var defs = el("defs");
    var lg = el("linearGradient", {id:uid, x1:81.8621, y1:75.25, x2:298.534, y2:266.491,
                                   gradientUnits:"userSpaceOnUse"});
    lg.appendChild(el("stop", {"stop-color":"#474B50"}));
    lg.appendChild(el("stop", {offset:"1", "stop-color":"#AFAFAF"}));
    defs.appendChild(lg);
    svg.appendChild(defs);

    svg.appendChild(el("rect", {x:-140, y:-140, width:740, height:800, fill:"#f5e6e6"}));

    var dialG = null;
    if (opts.dial){
      var dial = dialG = el("g", {"class":"dial"});
      for (var di = 0; di <= DIAL_STEPS; di++){
        var major = (DIAL_MIN + di * DIAL_STEP) % 300 === 0 || di === 0 || di === DIAL_STEPS;
        var a = di / DIAL_STEPS * DIAL_SWEEP;
        dial.appendChild(el("line", {
          x1:PCX, y1:PCY + 184, x2:PCX, y2:PCY + (major ? 200 : 193),
          stroke:major ? "#b9a595" : "#cfc0b3",
          "stroke-width":major ? 4 : 2,
          "stroke-linecap":"round",
          transform:"rotate(" + a + " " + PCX + " " + PCY + ")"
        }));
      }
      svg.appendChild(dial);
    }

    /* Pan and handle rotate as one group. The pan face is a perfect circle,
       so all the viewer sees is the handle moving. */
    var panExit = el("g");          /* the whole pan exits downwards on serve */
    var rotG = el("g");
    panExit.appendChild(rotG);
    svg.appendChild(panExit);

    /* handle — sits beneath the pan */
    var hand = el("g", {transform:"translate(189,396)"});
    hand.appendChild(el("rect", {x:11, y:33, width:54, height:48, fill:"#AEB0B2"}));
    hand.appendChild(el("rect", {x:0, y:61, width:75, height:195, rx:20, fill:"#363B3F"}));
    hand.appendChild(el("path", {d:"M65 42.0947C56.1805 43.3494 47.1662 44 38 44C28.8338 44 19.8195 43.3494 11 42.0947V0H65V42.0947Z", fill:"#83868B"}));
    rotG.appendChild(hand);

    var pan = el("g", {transform:"translate(49,70.5)"});   /* measured off the PNG: outer rim top at y=72 */
    pan.appendChild(el("circle", {cx:178, cy:178, r:176.5, fill:"#585E64", stroke:"#C0C7CD", "stroke-width":3}));
    pan.appendChild(el("circle", {cx:178, cy:178, r:162, fill:"#33373C", stroke:"#24272B", "stroke-width":2}));
    pan.appendChild(el("circle", {cx:178.5, cy:178.5, r:145, fill:"#585E64", stroke:"url(#"+uid+")", "stroke-width":5}));
    rotG.appendChild(pan);

    if (opts.dial){
      /* The whole handle is grabbable: this covers its full length from the
         pan rim to the tip, with 20px of slop on each side. */
      var grip = el("rect", {x:169, y:396, width:115, height:262, rx:40,
                             fill:"transparent", "class":"grip"});
      grip.setAttribute("tabindex", "0");
      grip.setAttribute("role", "slider");
      grip.setAttribute("aria-label", "Turn the handle to set the countdown");
      grip.setAttribute("aria-valuemin", DIAL_MIN);
      grip.setAttribute("aria-valuemax", DIAL_MAX);
      rotG.appendChild(grip);
      svg.grip = grip;
    }

    /* Successful-serve sunburst (Figma node 2706:2857), above the pan, below the plate */
    var raysG = null;
    if (opts.dial){
      raysG = el("g", {"class":"rays", opacity:0});
      /* Angular spans of the white wedges, taken from the original conic-gradient
         colour stops (in %, from 90deg) */
      [[0,4.33],[11.54,15.86],[23.09,34.62],[41.36,48.55],[56,65],[74.53,85.58],[90,94.78]]
        .forEach(function(w){
          var R = 430, D = Math.PI / 180;
          var a0 = (90 + w[0] * 3.6) * D, a1 = (90 + w[1] * 3.6) * D;
          var x0 = PCX + R * Math.sin(a0), y0 = PCY - R * Math.cos(a0);
          var x1 = PCX + R * Math.sin(a1), y1 = PCY - R * Math.cos(a1);
          raysG.appendChild(el("path", {
            d: "M" + PCX + " " + PCY + " L" + x0.toFixed(1) + " " + y0.toFixed(1) +
               " A" + R + " " + R + " 0 0 1 " + x1.toFixed(1) + " " + y1.toFixed(1) + " Z",
            fill: "#ffffff"
          }));
        });
      svg.appendChild(raysG);
    }

    /* Plate: Figma node 2696:2130, 362x362, sharing the pan's centre */
    var plateG = null;
    if (opts.dial){
      plateG = el("g", {opacity:0});
      var pin = el("g", {transform:"translate(46,67.5)"});
      var rim = el("g", {filter:"url(#fx-plate)"});
      rim.appendChild(el("circle", {cx:181, cy:181, r:175, fill:"#F7E8E5"}));
      rim.appendChild(el("circle", {cx:181, cy:181, r:177.5, fill:"none", stroke:"#D4CEC7", "stroke-width":5}));
      pin.appendChild(rim);
      pin.appendChild(el("ellipse", {cx:180.5, cy:175, rx:171.5, ry:169, fill:"#FFFBFB"}));
      pin.appendChild(el("ellipse", {cx:180.5, cy:181, rx:171.5, ry:163, fill:"#F8EFE7"}));
      var well = el("g", {filter:"url(#fx-plate)"});
      well.appendChild(el("circle", {cx:181, cy:182, r:115, fill:"#F8EFE7"}));
      well.appendChild(el("circle", {cx:181, cy:182, r:112.5, fill:"none", stroke:"#D4CEC7", "stroke-width":5}));
      pin.appendChild(well);
      pin.appendChild(el("ellipse", {cx:261.36, cy:60.2648, rx:20.5, ry:9, fill:"#FFFAF5",
                                     transform:"rotate(41.1393 261.36 60.2648)"}));
      pin.appendChild(el("ellipse", {cx:287.749, cy:83.9491, rx:9, ry:6.5, fill:"#FFFAF5",
                                     transform:"rotate(41.1393 287.749 83.9491)"}));
      plateG.appendChild(pin);
      svg.appendChild(plateG);
    }

    /* Serve cutlery: Figma node 2697:2758 — angled in from the bottom
       corners and clipped by the card. These are raster assets with the
       shading baked in, highlights and grain included. */
    var setG = null, setFork = null, setKnife = null;
    if (opts.dial){
      setG = el("g", {opacity:0});
      setFork = el("image", {x:27.3, y:353, width:90, height:265.2,
                             transform:"rotate(-10 72.3 485.6)", href:FORK_IMG});
      setKnife = el("image", {x:337, y:310, width:80, height:295.1,
                              transform:"rotate(10 377 457.55)", href:KNIFE_IMG});
      setG.appendChild(setFork);
      setG.appendChild(setKnife);
      svg.appendChild(setG);
    }

    /* Batter and bubbles share a group so they move to the plate together */
    var cakeWrap = el("g");
    var cakeG = el("g");
    function slotRow(cls, parent){
      return SLOT_X.map(function(x){
        var n = el("text", {x:x, y:CY, "class":"cake " + cls, lengthAdjust:"spacingAndGlyphs"});
        (parent || cakeG).appendChild(n);
        return n;
      });
    }
    /* Back to front: shadow -> outer edge -> inner edge, so adjacent glyphs
       do not paint over each other. The five shadow glyphs are composited
       opaque inside their own group first, and the 50% is applied to the
       group — otherwise the overlaps would double up and go darker. */
    var shadeG = el("g", {"class":"cake-shade-wrap"});
    cakeG.appendChild(shadeG);
    var shadeSlots = slotRow("cake-outer cake-shade", shadeG);
    var outerSlots = slotRow("cake-outer");
    var innerSlots = slotRow("cake-inner");
    cakeWrap.appendChild(cakeG);

    /* Bubbles belong to the batter, so the same text clips them into the glyphs */
    var clipId = uid + "-cake";
    var clip = el("clipPath", {id:clipId});
    var clipSlots = SLOT_X.map(function(x, i){
      var n = el("text", {x:x, y:CY, "class":"cake", lengthAdjust:"spacingAndGlyphs"});
      clip.appendChild(n);
      return n;
    });
    defs.appendChild(clip);

    var bubbleG = el("g", {"clip-path":"url(#" + clipId + ")"});
    var bubbleNodes = BUBBLES.map(function(){
      var e = el("ellipse", {opacity:0});
      bubbleG.appendChild(e);
      return e;
    });
    cakeWrap.appendChild(bubbleG);
    svg.appendChild(cakeWrap);

    return {
      node: svg,
      set: function(state, dialAngle, plateP, glow){
        if (raysG) raysG.setAttribute("opacity", (0.6 * clamp(glow || 0)).toFixed(3));
        rotG.setAttribute("transform",
          "rotate(" + (dialAngle || 0).toFixed(2) + " " + PCX + " " + PCY + ")");

        if (plateG){
          var raw = plateP || 0;
          var pp = clamp(raw);          /* pan, plate and pancake all settle within 0 -> 1 */
          /* the pan slides out, the plate scales in from 0.9, the batter
             hops once and settles */
          panExit.setAttribute("opacity", (1 - smooth((pp - 0.22) / 0.4)).toFixed(3));
          panExit.setAttribute("transform", "translate(0," + (150 * smooth(pp)).toFixed(1) + ")");
          var pk = 0.88 + 0.12 * smooth((pp - 0.18) / 0.5);
          plateG.setAttribute("opacity", smooth((pp - 0.18) / 0.34).toFixed(3));
          plateG.setAttribute("transform",
            "translate(" + PCX + "," + PCY + ") scale(" + pk.toFixed(4) +
            ") translate(" + (-PCX) + "," + (-PCY) + ")");
          var lift = -34 * Math.sin(Math.PI * pp);
          var sq = Math.sin(Math.PI * smooth((pp - 0.72) / 0.28));
          cakeWrap.setAttribute("transform",
            "translate(" + PCX + "," + (PCY + lift).toFixed(2) + ") scale(" +
            (1 + 0.05 * sq).toFixed(4) + "," + (1 - 0.05 * sq).toFixed(4) + ") translate(" +
            (-PCX) + "," + (-PCY) + ")");

          /* the cutlery only pushes up from below once the plate segment is
             completely finished (raw = 1) */
          var ck = smooth((raw - 1) / 0.32);
          var rise = 54 * (1 - ck);
          setG.setAttribute("opacity", ck.toFixed(3));
          setFork.setAttribute("transform",
            "translate(0," + rise.toFixed(1) + ") rotate(-10 72.3 485.6)");
          setKnife.setAttribute("transform",
            "translate(0," + rise.toFixed(1) + ") rotate(10 377 457.55)");
        }
        for (var i = 0; i < SLOT_X.length; i++){
          var ch = state.text.charAt(i);
          var len = slotLen(ch, i);
          [shadeSlots[i], outerSlots[i], innerSlots[i], clipSlots[i]].forEach(function(n){
            n.textContent = ch;
            if (len == null) n.removeAttribute("textLength");
            else n.setAttribute("textLength", len.toFixed(2));
          });
          shadeSlots[i].setAttribute("fill", "#D4CEC7");
          shadeSlots[i].setAttribute("stroke", "#D4CEC7");
          outerSlots[i].setAttribute("fill", state.rimOuter);
          outerSlots[i].setAttribute("stroke", state.rimOuter);
          innerSlots[i].setAttribute("fill", state.fill);
          innerSlots[i].setAttribute("stroke", state.rimInner);
        }
        paintBubbles(bubbleNodes, state);
        svg.setAttribute("aria-label", (opts.label || "Pancake timer") + ", " + state.text + ", " + state.stage);
      }
    };
  }

  /* ---- Colour interpolation ---- */
  function hex(h){
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  }
  function mix(a, b, t){
    var A = hex(a), B = hex(b);
    return "#" + [0,1,2].map(function(i){
      return Math.round(A[i] + (B[i]-A[i]) * t).toString(16).padStart(2,"0");
    }).join("");
  }
  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(v, lo, hi){ return clamp((v - lo) / (hi - lo)); }
  function smooth(v){ v = clamp(v); return v * v * (3 - 2 * v); }

  /* Four stops: d=0 raw / d=0.1333 (13:00) / d=1 perfect / b=1 burnt.
     The first two come from the Figma vector layers' fills and strokes;
     the last two were sampled off the exported PNGs. */
  var RAMP = {
    fill:  ["#feefcd", "#fedd94", "#d57e36", "#5e3624"],
    outer: ["#f5d59b", "#f1da93", "#fde6a9", "#cd8842"],
    inner: ["#fae3b6", "#f6d9a0", "#eb9f4d", "#e5a362"]
  };
  function ramp(stops, d, b){
    var c;
    if (d <= 0.1333) c = mix(stops[0], stops[1], seg(d, 0, 0.1333));
    else { var k = seg(d, 0.1333, 1); c = mix(stops[1], stops[2], k * k); }
    if (b > 0) c = mix(c, stops[3], Math.pow(b, 0.8));
    return c;
  }

  /* Bubbles: the batter starts bubbling, they grow, then pop and the
     surface sets; past the deadline they fuse into scorch marks. Position,
     size and colour are all functions of t, so scrubbing the timeline
     replays them correctly. */
  function paintBubbles(nodes, st){
    var d = st.d, b = st.b, t = st.t;
    var setSmooth = smooth((d - 0.78) / 0.22);   /* the surface dries out approaching 00:00 */
    for (var i = 0; i < nodes.length; i++){
      var p = BUBBLES[i], n = nodes[i];
      var up   = smooth((d - p.born) / 0.16);
      var pop  = smooth((d - p.born - 0.34) / 0.30);
      var bub  = up * (1 - pop) * (1 - setSmooth);
      var ch   = smooth((b - p.charAt) / 0.45);
      var a    = Math.max(bub * (1 - 0.8 * b), ch);
      if (a <= 0.006){ n.setAttribute("opacity", 0); continue; }

      var r   = p.r * (0.5 + 0.5 * bub) * (1 + 1.45 * ch);
      var amp = 5.5 * d;
      var cx  = p.x + Math.sin(t * 0.015 + p.ph) * amp;
      var cy  = p.y + Math.cos(t * 0.011 + p.ph * 1.7) * amp * 0.7;

      var col = mix("#f7d9a0", "#f0b757", smooth(d * 1.6));
      col = mix(col, "#a8641f", pop);
      col = mix(col, "#352723", Math.pow(b, 0.75));

      n.setAttribute("cx", cx.toFixed(2));
      n.setAttribute("cy", cy.toFixed(2));
      n.setAttribute("rx", r.toFixed(2));
      n.setAttribute("ry", (r * 0.85).toFixed(2));
      n.setAttribute("fill", col);
      n.setAttribute("opacity", (a * 0.82).toFixed(3));
    }
  }

  var STAGES = [
    {at:0.00, name:"Raw batter",  bg:"#f7ecd8", fg:"#8a6a3a"},
    {at:0.10, name:"Colouring",   bg:"#fbe4b4", fg:"#8a5c20"},
    {at:0.72, name:"Almost done", bg:"#f5c98a", fg:"#7a4415"},
    {at:0.97, name:"Perfect",     bg:"#d57e36", fg:"#fff6e6"}
  ];

  /* t is elapsed seconds; total is the length of this countdown */
  function stateAt(t, total){
    total = total || 900;
    var burn = burnOf(total), end = endOf(total);
    t = Math.max(0, Math.min(end, t));
    var d = clamp(t / total);
    var b = clamp((t - total) / burn);

    /* Display: counts down to 00:00, then counts up */
    /* ceil while counting down, so the starting value is shown for a full
       second and 00:00 appears exactly at zero. floor once counting up. */
    var secs = t <= total ? Math.ceil(total - t) : Math.floor(t - total);
    var text = mmss(secs);

    var fill = ramp(RAMP.fill, d, b);
    var rimOuter = ramp(RAMP.outer, d, b);
    var rimInner = ramp(RAMP.inner, d, b);

    var stage = STAGES[0].name, chipBg = STAGES[0].bg, chipFg = STAGES[0].fg;
    for (var i = 0; i < STAGES.length; i++){
      if (d >= STAGES[i].at){ stage = STAGES[i].name; chipBg = STAGES[i].bg; chipFg = STAGES[i].fg; }
    }
    if (b > 0){
      stage = b < 0.45 ? "Overdone" : "Burnt";
      chipBg = b < 0.45 ? "#a8663a" : "#5e3624";
      chipFg = "#ffe9d2";
    }

    return {
      t:t, d:d, b:b, text:text,
      fill:fill, rimOuter:rimOuter, rimInner:rimInner, stage:stage,
      label: t <= total ? "Left" : "Over",
      chipBg:chipBg, chipFg:chipFg,
    };
  }

  /* ---- Hero pan: animated ---- */
  /* Keep Figma's original frame: the pan is larger than the card, so the
     handle is clipped along its whole length */
  var hero = makeTiimer({label:"Pancake timer pan", dial:true});
  document.getElementById("hero").appendChild(hero.node);

  var card = document.getElementById("hero");
  var clock = document.getElementById("clock");
  var clockLabel = document.getElementById("clock-label");
  var chip = document.getElementById("chip");
  var chipText = document.getElementById("chip-text");
  var toggle = document.getElementById("toggle");
  var toggleLabel = document.getElementById("toggle-label");
  var serveBtn = document.getElementById("serve");
  var replay = document.getElementById("replay");

  var served = null;   /* verdict frozen at the moment of serving */
  var serveOk = false; /* did this serve land in the 00:00 success window */
  var plateP = 0, plateRAF = null;

  /* The serve timeline has two segments: 0 -> 1 moves the pancake onto the
     plate, 1 -> PLATE_END lays out the cutlery. Each element eases inside
     its own segment, so this driver stays linear. */
  var PLATE_END = 1.35;      /* 1 = plating done; past 1 is the short cutlery beat */
  var SERVE_MS = 1030;       /* total time for 0 -> PLATE_END */
  function tweenPlate(to){
    if (plateRAF) cancelAnimationFrame(plateRAF);
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce){ plateP = to; render(); return; }
    var from = plateP, t0 = null;
    var dur = to > from ? SERVE_MS * Math.abs(to - from) / PLATE_END : 380;
    (function step(now){
      if (t0 === null) t0 = now;
      var k = Math.min(1, (now - t0) / dur);
      plateP = from + (to - from) * k;
      render();
      if (k < 1) plateRAF = requestAnimationFrame(step); else plateRAF = null;
    })(performance.now());
  }

  var t = 0, running = true, last = null;

  function render(){
    var s = stateAt(t, DUR);
    /* the burst fades in as the plate settles */
    hero.set(s, durToAngle(DUR), plateP, serveOk ? smooth((plateP - 0.15) / 0.5) : 0);
    clock.textContent = s.text;
    clockLabel.textContent = s.label;
    card.classList.toggle("is-served", !!served);
    chipText.textContent = served ? served[0] : s.stage;
    chip.style.setProperty("--chip-bg", served ? served[1] : s.chipBg);
    chip.style.setProperty("--chip-fg", served ? served[2] : s.chipFg);
    serveBtn.disabled = t <= 0 || !!served;
  }

  function setRunning(on){
    running = on;
    cookSound(on);
    toggleLabel.textContent = on ? "PAUSE" : "START";
    toggle.setAttribute("aria-label", on ? "Pause" : "Start");
    if (on){ last = null; requestAnimationFrame(tick); }
  }

  function tick(now){
    if (!running) return;
    if (last === null) last = now;
    t += (now - last) / 1000;
    last = now;
    var end = endOf(DUR);
    if (t >= end){ t = end; render(); setRunning(false); return; }
    render();
    requestAnimationFrame(tick);
  }

  var grip = hero.node.grip;
  var dialing = false;

  function pointToAngle(e){
    var r = hero.node.getBoundingClientRect();
    var vb = hero.node.viewBox.baseVal;
    var ux = vb.x + (e.clientX - r.left) / r.width * vb.width;
    var uy = vb.y + (e.clientY - r.top) / r.height * vb.height;
    var a = Math.atan2(-(ux - PCX), uy - PCY) * 180 / Math.PI;   /* 0 is straight down, clockwise is positive */
    return a < 0 ? a + 360 : a;
  }
  function dialTo(a){
    /* inside the gap, snap to whichever end is nearer rather than
       sweeping all the way round */
    if (a > DIAL_SWEEP) a = a < (DIAL_SWEEP + 360) / 2 ? DIAL_SWEEP : 0;
    setDur(angleToDur(a));
  }
  function setDur(sec){
    var target = Math.max(DIAL_MIN, Math.min(DIAL_MAX, sec));
    var now = Date.now();
    /* dragging fires continuously, so throttle it; once clamped at an end, stay quiet */
    if (target !== DUR && now - lastSlide > 150){
      lastSlide = now;
      playSlide(target > DUR ? 1 : -1);
    }
    if (served){ served = null; serveOk = false; plateP = 0; }
    DUR = Math.max(DIAL_MIN, Math.min(DIAL_MAX, sec));
    t = 0;
    applyDuration();
  }

  grip.addEventListener("pointerdown", function(e){
    dialing = true;
    setRunning(false);
    card.classList.add("is-setting");
    grip.setPointerCapture(e.pointerId);
    dialTo(pointToAngle(e));
    e.preventDefault();
  });
  grip.addEventListener("pointermove", function(e){ if (dialing) dialTo(pointToAngle(e)); });
  function endDial(){
    stopSlide();
    dialing = false;
    if (document.activeElement !== grip) card.classList.remove("is-setting");
  }
  grip.addEventListener("keyup", stopSlide);
  grip.addEventListener("blur", stopSlide);
  grip.addEventListener("pointerup", endDial);
  grip.addEventListener("pointercancel", endDial);
  grip.addEventListener("focus", function(){ card.classList.add("is-setting"); });
  grip.addEventListener("blur", function(){ if (!dialing) card.classList.remove("is-setting"); });
  grip.addEventListener("keydown", function(e){
    var d = null;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") d = DUR + DIAL_STEP;
    if (e.key === "ArrowLeft"  || e.key === "ArrowDown") d = DUR - DIAL_STEP;
    if (e.key === "Home") d = DIAL_MIN;
    if (e.key === "End")  d = DIAL_MAX;
    if (d === null) return;
    e.preventDefault();
    setRunning(false);
    setDur(d);
  });

  /* for screen recording */
  window.__plate = function(v, verd){
    plateP = v * PLATE_END;
    served = v > 0 ? (verd || verdict(stateAt(t, DUR))) : null;
    render();
  };
  window.__dial = function(sec, showTicks){
    setRunning(false);
    card.classList.toggle("is-setting", !!showTicks);
    setDur(sec);
  };

  function applyDuration(){
    grip.setAttribute("aria-valuenow", DUR);
    grip.setAttribute("aria-valuetext", mmss(DUR));
    document.querySelectorAll(".sp-btn").forEach(function(o){
      o.setAttribute("aria-pressed", Number(o.dataset.dur) === DUR ? "true" : "false");
    });
    render();
  }
  document.querySelectorAll(".sp-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      DUR = Number(btn.dataset.dur);
      document.querySelectorAll(".sp-btn").forEach(function(o){
        o.setAttribute("aria-pressed", o === btn ? "true" : "false");
      });
      t = 0;
      applyDuration();
      setRunning(false);
    });
  });

  toggle.addEventListener("click", function(){
    playSfx("click");
    if (served){ served = null; serveOk = false; tweenPlate(0); }
    if (!running && t >= endOf(DUR)) t = 0;
    setRunning(!running);
  });
  replay.addEventListener("click", function(){
    playSfx("click");
    served = null; serveOk = false; t = 0; setRunning(false); tweenPlate(0);
  });

  /* Serve: stop the clock and report how this pancake turned out */
  function verdict(st){
    if (st.b > 0.45) return ["Burnt\u2026", "#5e3624", "#ffe9d2"];
    if (st.b > 0)    return ["A bit overdone", "#a8663a", "#ffe9d2"];
    if (st.d > 0.92) return ["Just right!", "#d57e36", "#fff6e6"];
    if (st.d > 0.6)  return ["So close", "#f5c98a", "#7a4415"];
    return ["Not ready", "#f7ecd8", "#8a6a3a"];
  }
  var SERVE_WINDOW = 2.5;   /* 2.5s either side of 00:00 = a five-second window */
  serveBtn.addEventListener("click", function(){
    if (t <= 0 || served) return;
    setRunning(false);
    serveOk = Math.abs(t - DUR) <= SERVE_WINDOW;
    playSfx(serveOk ? "ok" : "normal");
    served = verdict(stateAt(t, DUR));
    tweenPlate(PLATE_END);
  });

  window.__icon = function(showPause){
    toggleLabel.textContent = showPause ? "PAUSE" : "START";
  };

  applyDuration();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ ADV = {}; render(); });
  setRunning(false);

  /* Scale the 660x900 layout to fit the window, so every position below
     can be hard-coded straight from the design. */
  var stage = document.getElementById("stage");
  var shell = document.getElementById("shell");
  function fit(){
    var k = Math.min((window.innerWidth - 32) / 660, (window.innerHeight - 32) / 900, 1.2);
    k = Math.max(k, 0.28);
    stage.style.transform = "scale(" + k + ")";
    shell.style.height = (900 * k) + "px";
    shell.style.width = (660 * k) + "px";
  }
  fit();
  window.addEventListener("resize", fit);
})();</script>
